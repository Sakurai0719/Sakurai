<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400m Track & Field Pro - オンラインランキング</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ※ゲーム本体と同じFirebase設定をここに記述してください
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ランキング取得・描画メイン処理
        async function fetchRankings(category) {
            const container = document.getElementById('ranking-list-container');
            container.innerHTML = `<div class="text-center py-10 text-slate-400">読み込み中...</div>`;

            try {
                const q = query(collection(db, `rankings/v1/${category}`));
                const snapshot = await getDocs(q);
                let data = [];
                snapshot.forEach(doc => {
                    data.push(doc.data());
                });

                // ソート処理
                if (category === 'rta' || category === 'pb') {
                    // 少ない順（昇順）
                    data.sort((a, b) => Number(a.val) - Number(b.val));
                } else if (category === 'pbCount') {
                    // 多い順（降順）
                    data.sort((a, b) => Number(b.val) - Number(a.val));
                }

                if (data.length === 0) {
                    container.innerHTML = `<div class="text-center py-10 text-slate-400">まだランキングデータがありません</div>`;
                    return;
                }

                let html = '';
                data.forEach((item, index) => {
                    const rank = index + 1;
                    let rankBadge = `bg-slate-700 text-slate-200`;
                    if (rank === 1) rankBadge = `bg-yellow-500 text-white shadow-md shadow-yellow-500/50`;
                    else if (rank === 2) rankBadge = `bg-slate-300 text-slate-800`;
                    else if (rank === 3) rankBadge = `bg-amber-700 text-white`;

                    let displayVal = item.display || item.val;
                    if (category === 'pb') displayVal = Number(item.val).toFixed(2) + "秒";
                    if (category === 'pbCount') displayVal = item.val + "回";

                    html += `
                        <div class="flex items-center justify-between p-3 bg-slate-800/60 rounded-xl border border-slate-700/50 mb-2 hover:bg-slate-800 transition">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 flex items-center justify-center rounded-lg font-bold text-sm ${rankBadge}">
                                    ${rank}
                                </div>
                                <div>
                                    <div class="font-bold text-slate-100">${escapeHtml(item.name)}</div>
                                    <div class="text-xs text-slate-400">${item.date || ''}</div>
                                </div>
                            </div>
                            <div class="text-right font-mono font-bold text-emerald-400 text-sm md:text-base">
                                ${displayVal}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="text-center py-10 text-red-400">データの取得に失敗しました</div>`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // タブ切り替え制御
        window.switchTab = function(category, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm text-slate-400 hover:text-white transition";
            });
            btnElement.className = "tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition";
            fetchRankings(category);
        };

        // 初期表示
        window.addEventListener('DOMContentLoaded', () => {
            fetchRankings('pb');
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[600px]">
        <!-- ヘッダー -->
        <div class="p-4 bg-slate-850 border-b border-slate-800 flex justify-between items-center">
            <h1 class="font-black text-lg text-indigo-400 flex items-center gap-2">
                🏆 400m Pro オンラインランキング
            </h1>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">ゲームに戻る</a>
        </div>

        <!-- タブ切り替え -->
        <div class="flex p-2 bg-slate-900 border-b border-slate-800 justify-around">
            <button onclick="switchTab('pb', this)" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition">自己ベスト(PB)</button>
            <button onclick="switchTab('rta', this)" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm text-slate-400 hover:text-white transition">世界優勝RTA</button>
            <button onclick="switchTab('pbCount', this)" class="tab-btn px-4 py-2 rounded-lg font-bold text-sm text-slate-400 hover:text-white transition">更新回数</button>
        </div>

        <!-- リスト表示エリア -->
        <div id="ranking-list-container" class="flex-1 overflow-y-auto p-4 space-y-1">
            <!-- 動的にデータが挿入されます -->
        </div>

        <!-- フッター -->
        <div class="p-3 bg-slate-950 border-t border-slate-900 text-center text-xs text-slate-500">
            400m Track & Field Pro Leaderboard
        </div>
    </div>

</body>
</html>
